---
name: HACS Validation

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# The job only checks out and validates; it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      # HACS documents `@main` as the recommended reference for this action.
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
